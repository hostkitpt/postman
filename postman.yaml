- name: City Tax
  description: City-tax declarations and available PDF documents.
  item:
  - name: getCityTaxDeclarations
    request:
      method: GET
      description: 'Read account city-tax declarations with their local PDF in document as base64 JSON, or null when no local
        PDF is available.


        Search both declaration sources for the authenticated account, including historical declarations. No apid or id is
        accepted or returned. source is a response field, not a request filter; uniqid searches both sources and remains the
        declaration identifier. All supplied filters intersect. Month and quarter are mutually exclusive and require year.


        Validate source-specific periods and states. iTaxas keeps its stored numeric month when historical periodicity is
        unknown.


        license_number matches one complete registration or an exact member of a comma-separated merged group, never a substring.
        Each stored merged declaration is returned as one object with the full license_number list; number, multibanco and
        document belong to the whole group. Payment amounts are not split between registrations. Never expose municipal credentials
        or internal error text.


        Returns declarations, limit, offset and has_more. Each declaration contains document: {content_base64, content_type,
        filename} for an available local TMTAI PDF, otherwise null.


        document_available is distinct from document_supported. Remote iTaxas documents are not fetched and token URLs are
        never returned. Invalid local PDF content returns invalid_document. Local files are bounded at 50 MiB; delivery additionally
        requires the page to fit 60 MiB of encoded document JSON, below the 64 MiB HTTP ceiling. An oversized page, including
        an individual PDF too large after Base64 encoding, returns HTTP 413 response_too_large. Filter by uniqid or use a
        smaller limit for multi-document pages.


        Results always remain a paginated declarations array, including with uniqid. No matches return an empty array, not
        a not_found error. If a uniqid occurs in both sources, both account-owned records are returned.


        Each declaration includes its saved number and multibanco: {entity, reference, amount}, or null when payment data
        is missing or malformed. Both declaration sources are supported. Entity and reference are strings preserving leading
        zeros; amount is a nonnegative decimal string with two decimal places and a dot separator.


        Parameters


        | Field | Type | Required | Description / constraints |

        | --- | --- | --- | --- |

        | `license_number` | string | No | One numeric registration number; matches a single declaration or an exact member
        of a merged declaration. pattern: "^[0-9]+$"; maxLength: 128 |

        | `uniqid` | string | No | Opaque declaration identity from the selected source. pattern: "^[A-Za-z0-9._-]+$"; maxLength:
        128 |

        | `year` | integer | No | Calendar year. minimum: 1000; maximum: 9999 |

        | `month` | integer | No | Calendar month. minimum: 1; maximum: 12 |

        | `quarter` | integer | No | Quarter, distinct from month. minimum: 1; maximum: 4 |

        | `status` | string | No | Exact source status: do not collapse submitted, paid and settled states.  |

        | `limit` | integer | No | Result limit; default 25. minimum: 1; maximum: 100 |

        | `offset` | integer | No | Result offset; default 0. minimum: 0; maximum: 2147483647 |'
      header:
      - key: Accept
        value: application/json
      - key: X-API-Key
        value: '{{apiKey}}'
        description: Set apiKey locally; never share the real value.
      - key: X-Timestamp
        value: '{{apiTimestamp}}'
        description: Generated locally by the collection HMAC pre-request script for each request.
      - key: X-Nonce
        value: '{{apiNonce}}'
        description: Generated locally by the collection HMAC pre-request script for each request.
      - key: X-Signature
        value: '{{apiSignature}}'
        description: Generated locally by the collection HMAC pre-request script for each request.
      url:
        raw: '{{baseUrl}}/getCityTaxDeclarations'
        host:
        - '{{baseUrl}}'
        path:
        - getCityTaxDeclarations
        query:
        - key: license_number
          value: '123456'
          disabled: true
          description: One numeric registration number; matches a single declaration or an exact member of a merged declaration.
        - key: uniqid
          value: example-declaration
          disabled: true
          description: Opaque declaration identity from the selected source.
    response: []
