info:
  name: Hostkit API
  schema: https://schema.getpostman.com/json/collection/v2.1.0/collection.json
  description: Public Hostkit API collection for Postman.

auth:
  type: apikey
  apikey:
    - key: key
      value: APIKEY
      type: string
    - key: value
      value: "{{APIKEY}}"
      type: string
    - key: in
      value: query
      type: string

variable:
