    - name: generateSAFT
      request:
        method: POST
        description: 'Generate a SAF-T file for an authorized fiscal account.


          Generation and reading are serialized for each account, VAT ID and period. Concurrent requests return operation_in_progress.


          Validate the complete export before replacing the previous document. Generation or validation failures preserve
          the previous export.


          A generated export is limited to 40 MiB. Reconcile document_publication_pending or commit_uncertain outcomes before
          retrying; this period remains unavailable until recovery is completed.


          Parameters


          | Field | Type | Required | Description / constraints |

          | --- | --- | --- | --- |

          | `invoicing_nif` | string | Yes | Explicit invoicing VAT ID; the backend must verify account authorization. pattern:
          "^[A-Za-z0-9._-]{1,64}$" |

