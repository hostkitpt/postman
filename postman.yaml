info:
  name: Hostkit API v2
  description: "# Hostkit API v2\n\nOur REST based API allows you to get access to the Hostkit application. On this page we\
    \ explain you a little bit more detailed what you need for your use case as a host.\n\nPlease [contact us](https://hostkit.pt/suporte/)\
    \ before you start coding. Tell us a few words about your ideas and plans. We are always happy to help our customers and\
    \ partners to build the best integrated applications.\n\nIf you have any questions about our API, please feel free to\
    \ open a ticket in our [Helpdesk](https://hostkit.pt/suporte/).\n\nFor agents/LLMs, use the API v2 Markdown references\
    \ and downloadable Postman collection.\n\n**WARNING:** Be very careful when using AI-generated or \"vibe-coded\" integrations.\
    \ Hostkit is not responsible for API misuse, incorrect implementations, or unintended actions caused by third-party code.\n\
    \nBase URL: `https://app.hostkit.pt/api/v2`\n\n## Authentication\n\nEvery request requires an API key and an HMAC-SHA256\
    \ signature. An API key alone is not sufficient.\n\nCreate your credentials in Hostkit My Account. Store the API key and\
    \ the HMAC secret securely; the secret is shown only when the key is created. Never put credentials in URLs or request\
    \ bodies, or include them in shared environments and exports.\n\nRequired headers:\n\n| Header | Value |\n| --- | ---\
    \ |\n| `X-API-Key` | Your 50-character ASCII alphanumeric API key. |\n| `X-Timestamp` | Current UTC time in `YYYY-MM-DDTHH:mm:ssZ`\
    \ format. |\n| `X-Nonce` | A fresh UUID v4 for every request, including retries. |\n| `X-Signature` | Base64-encoded HMAC-SHA256\
    \ of the canonical request. |\n\n### Use with Postman\n\nImport the collection; no separate environment is required. Set\
    \ the collection variables `apiKey` and `apiSecret` locally, leaving their shared values empty, and keep requests set\
    \ to **Inherit auth from parent**. The collection configures API Key authentication with header `X-API-Key`. Its pre-request\
    \ script also generates the mandatory timestamp, nonce and HMAC signature.\n\nThe script substitutes variables in the\
    \ raw JSON before signing, preserving whitespace and field order. The examples use fictitious values. If your account\
    \ has an IP whitelist, requests must originate from an allowed IP address.\n\nRequest examples show all four authentication\
    \ headers. The signer generates `apiTimestamp`, `apiNonce` and `apiSignature` as local, request-scoped variables; do not\
    \ fill or share them manually. Published cURL placeholders are not usable credentials or signatures. Outside Postman,\
    \ calculate a fresh signature for the exact request as described below.\n\n### Sign requests outside Postman\n\nSignature\
    \ is Base64 of HMAC-SHA256. **Base64 text representing 32 random bytes; use that text as the UTF-8 HMAC key, without Base64\
    \ decoding.**\n\nCanonical UTF-8 text uses LF separators with **no final LF**:\n\n```text\nMETHOD\nPATH\nCANONICAL_QUERY\n\
    TIMESTAMP\nNONCE\nSHA256_RAW_BODY_HEX\nAPI_KEY\n```\n\nMETHOD is uppercase; PATH is the exact public `/api/v2/command`\
    \ path. Decode once; reject invalid percent/UTF-8 encoding and duplicate decoded keys; RFC3986 encode and sort encoded\
    \ keys; space is %20. The query line is empty without filters. Hash the exact transmitted raw body bytes as lowercase\
    \ SHA-256 hex; GET hashes the empty body. Timestamp: UTC YYYY-MM-DDTHH:mm:ssZ; nonce: UUID v4.\n\nThe timestamp must be\
    \ within five minutes of the server clock. A nonce cannot be reused. Invalid or expired authentication returns HTTP 401.\n\
    \nGenerated code snippets containing only `X-API-Key` are incomplete: clients outside Postman must also implement HMAC\
    \ signing.\n\n## IP Whitelisting\n\nIP whitelisting is supported in API v2. It uses the same account-wide allowlist as\
    \ API v1 and applies to every API key belonging to that account.\n\n- With no entries configured, source IP is not restricted.\
    \ API key and HMAC authentication are still mandatory.\n- Once an entry exists, requests must match at least one allowed\
    \ IPv4 address or IPv4 CIDR range.\n- IPv6 is not currently supported. With an allowlist configured, addresses that do\
    \ not match an IPv4 entry are rejected.\n\nManage addresses and ranges in Hostkit **My Account \u2192 Hostkit API IP whitelist**.\
    \ Entries can have descriptive names. For example, `198.51.100.42` permits one address and `198.51.100.0/24` permits that\
    \ IPv4 network. Add all outbound addresses used by the integration before enabling restrictions.\n\nA request from an\
    \ address outside the allowlist returns **HTTP 403** with `error.code: \"ip_not_allowed\"`, before the endpoint is executed:\n\
    \n```json\n{\"status\":\"failure\",\"error\":{\"code\":\"ip_not_allowed\",\"message\":\"IP address not allowed\"},\"meta\"\
    :{\"request_id\":\"example-request-id\"}}\n```\n\nThe last access value of each matching entry is updated as a Unix timestamp\
    \ after successful authentication and IP authorization. Rejected addresses do not update last access. IP whitelisting\
    \ supplements API key and HMAC authentication; it does not replace either.\n\n## Rate Limit\n\nThe API rate limit is **100\
    \ requests per minute**, the same as API v1, and is enforced by the gateway. There is no additional request counter in\
    \ API v2. If you need a higher limit, contact [Hostkit support](https://hostkit.pt/suporte/). Avoid repeated polling and\
    \ uncontrolled parallel requests; reuse previously retrieved data where appropriate.\n\nIf you receive HTTP 429 from the\
    \ gateway, wait for the period indicated by `Retry-After`, when present, before retrying. Otherwise use exponential backoff\
    \ with jitter. Gateway rejections may not use the API JSON error envelope. Every retry must have a fresh timestamp, nonce\
    \ and signature. Confirm the outcome of write requests before retrying; repeated writes can create duplicates.\n\nRequest\
    \ size, batch size and pagination limits are documented below and are separate from request frequency limits.\n\n## Requests\n\
    \nGET reads data using URL query parameters, without a body. POST creates, PATCH edits and DELETE deletes using a UTF-8\
    \ JSON object body, with no business query parameters. The maximum raw body size is **8192 bytes**, except **uploadExpenseFile**:\
    \ **7 MiB** of JSON for a file of at most **5 MiB** (5242880 bytes). Unknown fields and duplicate query parameters are\
    \ rejected.\n\nIDs, years and months are integers. Money is decimal text. Write booleans are JSON `true` or `false`; GET\
    \ booleans use exactly `true` or `false`. GET integers use plain decimal text without fractions or exponent notation.\
    \ Omitted update fields are preserved.\n\nAn API key identifies one account. Property operations require `apid` belonging\
    \ to that account. Fiscal operations require an authorized `invoicing_nif`; reservation references also require `apid`.\
    \ Available operations depend on your account permissions, license and enabled modules.\n\n`addExpense` and `addInvoice`\
    \ require a `lines` array containing 1 to 20 lines. The document and all lines are created atomically in one request:\
    \ any line failure rolls back the complete creation. The entire JSON body must fit 8192 bytes. An invoice remains a draft\
    \ until explicitly closed with `closeInvoice`.\n\n### Reservation filters\n\nIdentity and list filters cannot be combined:\
    \ rcode/CM selectors reject from_date, to_date, reservation_date, date_filter, room, provider, language and nif rather\
    \ than ignoring them. Invalid combinations return HTTP 422. Incomplete or conflicting channel-manager selectors are also\
    \ rejected.\n\nDate listing intersects supplied filters; it is not an overlap search. Without `date_filter`, `from_date`\
    \ constrains check-in and `to_date` constrains checkout at midnight. With `date_filter=checkin` or `date_filter=checkout`,\
    \ both boundaries apply to that date and include the selected end day.\n\n### Retries\n\nThe API does not deduplicate\
    \ write requests or replay stored responses. After a timeout or uncertain result, check application state before retrying\
    \ a write. Repeating a creation request can create another resource. Each retry requires a fresh timestamp, nonce and\
    \ signature.\n\n## Key permissions\n\nAccounts may have up to five API keys, each with read-only or read/write access.\
    \ Every key can read; write access is optional and new keys default to read-only. There are no write-only keys. Keys exist\
    \ until deleted; deleting a key frees a slot. GET operations require read, except getKeycode which can create a lock code\
    \ and requires write. POST/PATCH/DELETE require write. Missing permission returns HTTP 403 permission_denied before dispatch.\
    \ IP whitelist rules remain account-wide.\n\n## Responses\n\nSuccessful responses contain `status: \"success\"`, `data`\
    \ and `meta.request_id`. Each documented response data schema describes `data`, not the envelope root. POST `add*` operations\
    \ return HTTP 201; other successful operations return HTTP 200.\n\nNo cursor pagination is provided. City-tax declarations\
    \ and service users support their documented `limit` and `offset` parameters.\n\n## Errors\n\nErrors returned by the API\
    \ contain `status: \"failure\"`, `error.code`, `error.message`, optional `error.field` and `meta.request_id`. HTTP errors\
    \ include 400, 401, 403, 404, 405, 409, 413, 415, 422, 500, 501 and 503. API responses use `Cache-Control: no-store` and\
    \ `X-Request-ID`. Gateway responses, including HTTP 429, may use a different format.\n\n| HTTP status | Description |\n\
    | --- | --- |\n| 400 | Invalid request or business selector. |\n| 401 | Missing, invalid, expired or replayed authentication.\
    \ |\n| 403 | API key read/write permission, account/property/NIF authorization, license, module or IP restriction. |\n\
    | 404 | Operation or resource not found. |\n| 405 | Incorrect HTTP method; Allow identifies the required method. |\n|\
    \ 409 | Identity, shared-profile or resource-state conflict. |\n| 413 | Request body, expense file or inline city-tax\
    \ documents exceed the endpoint limit. |\n| 415 | Unsupported request media type. |\n| 422 | Typed schema or document\
    \ validation failed. |\n| 429 | Rate limit exceeded at the gateway; follow Retry-After when present before retrying. |\n\
    | 500 | Internal error; internal details are not exposed. |\n| 501 | Requested source capability is unsupported, including\
    \ remote iTaxas PDF delivery. |\n| 503 | Required handler, contract, transactional table or service is unavailable. |\n\
    \n```json\n{\"status\":\"failure\",\"error\":{\"code\":\"permission_denied\",\"message\":\"API key does not have the required\
    \ permission\"},\"meta\":{\"request_id\":\"example-request-id\"}}\n```\n\n### Write Outcomes\n\nUse `meta.request_id`\
    \ or `X-Request-ID` when contacting support. Authorized writes are audited by request, API key, endpoint, affected resources\
    \ and outcome; credentials, file contents and personal-data values are not included.\n\n| Error code | Action |\n| ---\
    \ | --- |\n| `audit_unavailable` | The write cannot proceed while audit storage is unavailable. |\n| `audit_incomplete`\
    \ | Effects may already have occurred. Contact support to reconcile the request before retrying. |\n| `commit_uncertain`\
    \ | The commit could not be confirmed. Check the resource and contact support before repeating the write. |\n| `at_submission_uncertain`,\
    \ `at_registration_uncertain` | Reconcile the external fiscal operation before retrying. |\n| `siba_submission_failed`\
    \ | Submission could not be confirmed; check its state before retrying. |\n| `siba_persistence_uncertain` | SIBA accepted\
    \ the submission but local completion failed. Reconcile it before retrying. |\n| `reservation_payment_reconciliation_required`,\
    \ `stripe_unavailable` | If the error identifies an already-created reservation, reconcile that reservation and its payment.\
    \ Do not repeat `addReservation`. |\n| `document_publication_pending` | Reconcile document publication before retrying.\
    \ |\n| `document_deletion_pending` | The expense may already be deleted, or its attachment may be staged for recovery.\
    \ Contact support before retrying or uploading another document. |\n\nAn error after an external action or a lost acknowledgement\
    \ does not prove that nothing changed. Never retry these outcomes automatically.\n\n## Enumerations\n\nSend these request\
    \ values exactly as listed. Defaults and required fields remain defined by each endpoint.\n\n### Properties license types\n\
