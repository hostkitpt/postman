        lines is required and contains 1 to 20 lines within the 8192-byte body limit. The header and all lines are committed
        together; any line failure rolls back the complete creation.


        Vendor, document number and descriptions accept punctuation, including apostrophes, as text. Invalid control characters
        are rejected. Retained attachments and unresolved document deletions are never assigned to a new expense.


