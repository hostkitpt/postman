    rio) |\n| `19` | Rents (Rendas) |\n| `20` | OTAs (Plataformas) |\n\n## Changelog\n\n### 2026-10-08\n\n- `deleteExpense`\
    \ also removes its locally stored attachment; confirmed failures restore it and uncertain outcomes require reconciliation.\
    \ New expenses cannot inherit retained attachments.\n- Expense vendor names, document numbers and descriptions accept\
    \ legitimate punctuation, including apostrophes.\n- Improve JSON HTTP 413 responses for rejected request bodies without\
    \ increasing endpoint size limits.\n- Added `getCustomers`, `addCustomer` and `deleteCustomer`; customers with associated\
    \ documents cannot be deleted.\n- Added `getCurrentAccount` with complete-period opening/closing balances and paginated\
    \ transactions. Manual unlinked transactions can be created, updated and deleted through the dedicated endpoints.\n- Added\
    \ `addModelo30Transaction` for monthly and recurring manual transactions; generation and submission remain separate actions.\n\
    - `addExpense` and `addInvoice` now require 1 to 20 `lines` in the creation request. Any line failure rolls back the document\
    \ and all lines. Invoices remain drafts until `closeInvoice`.\n- Removed the separate `addExpenseLine`, `addInvoiceLine`\
    \ and `addInvoiceLines` endpoints from API v2. Create each document and its lines together; API v1 is unchanged.\n- Added\
    \ correlated auditing of authorized writes and explicit `commit_uncertain` errors.\n- Strengthened guest validation, SIBA\
    \ document handling and account-specific SAF-T generation.\n- Serialized receipt, credit-note, guest, expense-line and\
    \ reservation-extra writes to prevent duplicate or partial changes.\n- Preserve previous expense attachments and SAF-T\
    \ exports on confirmed failed replacement; uncertain commits require reconciliation instead of automatic restoration or\
    \ retry.\n- New rental-contract references are unique and opaque, independent of draft deletion.\n\n### 2026-10-07\n\n\
    - Added `uploadExpenseFile` for PDF, JPG, JPEG and PNG documents sent as Base64, up to 5 MiB per decoded file. This endpoint\
    \ alone accepts a raw JSON body up to 7 MiB.\n- Added `updateRentalContract`, `submitRentalContract` and `deleteRentalContract`\
    \ for draft contracts. Submission activates a contract only after confirmed AT acceptance; uncertain results require reconciliation\
    \ before retrying.\n- `getCityTaxDeclarations` searches both declaration sources without `source`, `apid` or `id` request\
    \ parameters. `uniqid` searches both sources; `license_number` also matches complete members of merged declarations.\n\
    - Removed `getExpenseCategories`; category IDs remain documented in Enumerations.\n\n### 2.0.0\n\n- Account-wide API keys\
    \ with mandatory HMAC-SHA256 authentication and read-only or read/write permissions. Existing account IP whitelist rules\
    \ also apply to v2.\n- GET query filters for reads; POST, PATCH and DELETE with JSON bodies for writes. Confirm uncertain\
    \ write outcomes before retrying; repeated writes are not deduplicated.\n- Consolidated reads: `getReservations` can select\
    \ one reservation; `getProperties` can select one property. Expenses, invoices, credit notes, receipts and rental contracts\
    \ support individual selectors.\n- Invoicing configuration, series, products and Modelo 30 operations; service-user creation\
    \ and updates.\n- `getCityTaxDeclarations` includes a local PDF as Base64 in `document`, or null when unavailable; there\
    \ is no separate document endpoint.\n- Mintlify reference, downloadable Postman collection with automatic HMAC signing,\
    \ cURL examples and Markdown documentation for LLMs.\n\nAPI v1 remains separate and available; v2 does not change the\
    \ v1 request format.\n"
  schema: https://schema.getpostman.com/json/collection/v2.1.0/collection.json
