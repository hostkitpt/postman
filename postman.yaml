- name: Contracts
  description: Rental contracts.
  item:
  - name: getRentalContracts
    request:
      method: GET
      description: 'List rental contracts or read one by id or contract_ref.


        Requires the rental-contract module and an ARRE property. Scope every contract and tenant to the authenticated owner
        and apid.


        Omit selectors to list contracts; supply id or contract_ref for an individual lookup. If both are supplied, both must
        match. Results remain an array, empty when no contract matches.


        Return saved contract fields and tenants; never return internal AT response diagnostics or credentials.


        Parameters


        | Field | Type | Required | Description / constraints |

        | --- | --- | --- | --- |

        | `apid` | integer | Yes | Property ID belonging to the authenticated account.  |

        | `id` | integer | No | Numeric resource/document identity. minimum: 1; maximum: 9007199254740991 |

        | `contract_ref` | string | No | Exact contract reference returned by addRentalContract. pattern: "^[A-Za-z0-9._-]{1,128}$"
        |'
      header:
      - key: Accept
        value: application/json
