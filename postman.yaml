    - name: addModelo30Transaction
      request:
        method: POST
        description: 'Add a manual monthly or recurring Modelo 30 transaction.


          U requires year and month. R omits both and applies to all generated periods, including historical regeneration;
          response year/month are null.


          Validate beneficiary identifiers, country, income and taxation codes. Amount is a nonnegative decimal string, including
          zero.


          The transaction does not refresh an existing XML or submit a declaration. Use generateModelo30 explicitly after
          adding transactions.


          Creation and generation are serialized per account and invoicing_nif. Repeating a successful creation with a fresh
          nonce creates another transaction.


          Parameters


          | Field | Type | Required | Description / constraints |

          | --- | --- | --- | --- |

          | `invoicing_nif` | string | Yes | Explicit invoicing VAT ID; the backend must verify account authorization. pattern:
          "^[A-Za-z0-9._-]{1,20}$" |

          | `year` | integer | No | Calendar year. minimum: 1000; maximum: 9999 |

          | `month` | integer | No | Calendar month. minimum: 1; maximum: 12 |

          | `beneficiary_nif` | string | Yes | Portuguese beneficiary VAT ID. minLength: 1; maxLength: 50 |

          | `foreign_nif` | string | Yes | Foreign beneficiary VAT ID. minLength: 1; maxLength: 50 |

          | `country` | string | Yes | Official numeric country code used by Modelo 30, not an ISO/ICAO letter code. minLength:
          1; maxLength: 50 |

          | `income_type` | string | Yes | Existing two-character Modelo 30 income code. minLength: 2; maxLength: 2 |

          | `taxation` | string | Yes | Existing two-character Modelo 30 taxation code. minLength: 2; maxLength: 2 |

          | `amount` | string | Yes | Nonnegative amount with a dot separator and at most two decimal places; maximum 999999999999.99.
          pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$" |

          | `type` | string | Yes | U applies to one month; R applies to every generated month. enum: ["U","R"] |'
        header:
        - key: Accept
          value: application/json
        - key: X-API-Key
          value: '{{apiKey}}'
          description: Set apiKey locally; never share the real value.
        - key: X-Timestamp
          value: '{{apiTimestamp}}'
          description: Generated locally by the collection HMAC pre-request script for each request.
        - key: X-Nonce
          value: '{{apiNonce}}'
          description: Generated locally by the collection HMAC pre-request script for each request.
        - key: X-Signature
          value: '{{apiSignature}}'
          description: Generated locally by the collection HMAC pre-request script for each request.
        - key: Content-Type
          value: application/json
        url:
          raw: '{{baseUrl}}/addModelo30Transaction'
          host:
          - '{{baseUrl}}'
          path:
          - addModelo30Transaction
        body:
