event:
- listen: prerequest
  script:
    type: text/javascript
    exec:
    - function queryEntries(query) {
    - '  const raw = typeof query === ''string'' ? query.replace(/^\?/, '''') : query.toString();'
    - '  if (!raw) return [];'
    - '  if (raw.length > 4096 || /[^\x00-\x7f]/.test(raw)) throw new Error(''Query must be at most 4096 ASCII bytes; percent-encode
      UTF-8 values'');'
    - '  const seen = new Set();'
    - '  return raw.split(''&'').map((part) => {'
    - '    const separator = part.indexOf(''='');'
    - '    if (separator < 1) throw new Error(''Expected a named query parameter'');'
    - '    const decode = (value) => decodeURIComponent(value.replace(/\+/g, ''%20''));'
    - '    const key = decode(separator < 0 ? part : part.slice(0, separator));'
    - '    const value = decode(separator < 0 ? '''' : part.slice(separator + 1));'
    - '    if (!key || seen.has(key)) throw new Error(''Empty or duplicate query key'');'
    - '    seen.add(key);'
    - '    return [key, value];'
    - '  });'
    - '}'
    - ''
    - function canonicalQuery(query) {
    - '  const encode = (value) => encodeURIComponent(value).replace(/[!''()*]/g, (char) => `%${char.charCodeAt(0).toString(16).toUpperCase()}`);'
    - '  return queryEntries(query).map(([key, value]) => [encode(key), encode(value)])'
    - '    .sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0).map(([key, value]) => `${key}=${value}`).join(''&'');'
    - '}'
    - ''
    - (function postmanSigner() {
    - '  const CryptoJS = require(''crypto-js'');'
    - '  const key = pm.variables.get(''apiKey'');'
    - '  const secret = pm.variables.get(''apiSecret'');'
    - '  if (!key || !secret) throw new Error(''Set local apiKey and apiSecret variables'');'
    - '  const method = pm.request.method.toUpperCase();'
    - '  const url = pm.variables.replaceIn(pm.request.url.toString());'
    - '  const match = /^https:\/\/([^/?#]+)(\/[^?#]*)(?:\?([^#]*))?$/.exec(url);'
    - '  if (!match) throw new Error(''An exact HTTPS URL without fragment is required'');'
    - '  if (!/^\/api\/v2\/[A-Za-z]+$/.test(match[2])) throw new Error(''Unexpected public v2 path'');'
    - '  const query = canonicalQuery(match[3] ?? '''');'
    - '  if (method !== ''GET'' && query) throw new Error(''Write business parameters belong in JSON, not query'');'
    - '  let body = '''';'
    - '  if (pm.request.body) {'
    - '    if (pm.request.body.mode !== ''raw'') throw new Error(''Only raw JSON request bodies are supported'');'
    - '    body = pm.variables.replaceIn(pm.request.body.raw ?? '''');'
    - '    if (method === ''GET'' && body) throw new Error(''GET must not carry a body'');'
    - '    pm.request.body.raw = body;'
    - '  }'
    - '  if (method !== ''GET'') {'
    - '    const value = JSON.parse(body);'
    - '    if (!value || typeof value !== ''object'' || Array.isArray(value)) throw new Error(''Body must be a JSON object'');'
    - '    // UTF-8 byte count, not JavaScript character count; no reserialization.'
    - '    const maximum = match[2] === ''/api/v2/uploadExpenseFile'' ? 7340032 : 8192;'
    - '    if (unescape(encodeURIComponent(body)).length > maximum) throw new Error(''Body exceeds '' + maximum + '' UTF-8
      bytes'');'
    - '    pm.request.headers.upsert({ key: ''Content-Type'', value: ''application/json'' });'
    - '  }'
    - '  const timestamp = new Date().toISOString().replace(/\.\d{3}Z$/, ''Z'');'
    - '  const nonce = pm.variables.replaceIn(''{{$guid}}'');'
    - '  const digest = CryptoJS.SHA256(body).toString(CryptoJS.enc.Hex);'
    - '  const canonical = [method, match[2], query, timestamp, nonce, digest, key].join(''\n'');'
    - '  // apiSecret is Base64 TEXT used as the UTF-8 key, never Base64-decoded.'
    - '  const signature = CryptoJS.HmacSHA256(canonical, secret).toString(CryptoJS.enc.Base64);'
    - '  pm.variables.set(''apiTimestamp'', timestamp);'
    - '  pm.variables.set(''apiNonce'', nonce);'
    - '  pm.variables.set(''apiSignature'', signature);'
    - '  for (const [key, value] of Object.entries({ ''X-API-Key'': pm.variables.get(''apiKey''), ''X-Timestamp'': timestamp,
      ''X-Nonce'': nonce, ''X-Signature'': signature })) {'
    - '    pm.request.headers.upsert({ key, value });'
    - '  }'
    - '})();'
