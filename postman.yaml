  - name: uploadExpenseFile
    request:
      method: POST
      description: 'Attach or replace one expense document using a signed JSON upload; no URL downloads or QR processing.


        Maximum original file size is 5 MiB (5242880 bytes); the raw JSON ceiling is 7 MiB for this endpoint only. Other operations
        remain limited to 8192 bytes.


        Verify expense/account/property ownership and the expenses module. Detect the initial file type from its bytes, then
        require security validation; unsupported or malformed documents are rejected.


        PDF, JPG, JPEG and PNG files are sent to an external security service for Content Disarm and Reconstruction (CDR).
        Only the approved, reconstructed PDF/A is stored; images are accepted but the stored content type is always application/pdf.


        Both the original and reconstructed file must fit within 5 MiB. Unsafe files are rejected; timeouts, service failures
        or incomplete security results reject the upload without storing the original or replacing the existing attachment.


        No filename or content_type request parameter is accepted. Store privately under a server-generated name, without
        execution permissions. Replace the existing attachment only after successful processing.


        Uploading an attachment does not parse QR codes, change expense lines/totals, or fetch a client URL.


        Expense uploads share a validation-service rate limit of 1 call per second across all clients. Excess calls are queued
        for execution by the validation service rather than rejected immediately; sustained over-subscription increases latency.
        Hostkit adds no local waiting queue or automatic retry; validation requests have a 60-second timeout, including any
        provider-side waiting. When the validation service returns HTTP 429, the API responds with HTTP 503, code validation_unavailable
        and message "Expense uploads have a rate limit of 1 per second". Timeouts retain the generic validation-unavailable
        message. Failed uploads save no file and leave the existing attachment unchanged.


        Parameters


        | Field | Type | Required | Description / constraints |

        | --- | --- | --- | --- |

        | `apid` | integer | Yes | Property ID belonging to the authenticated account.  |

        | `id` | integer | Yes | Numeric resource/document identity. minimum: 1; maximum: 9007199254740991 |

        | `content_base64` | string | Yes | Canonical Base64 of PDF, JPG, JPEG or PNG bytes, without whitespace or a data
        URI. The file type is detected from its content; no filename is supplied. minLength: 4; maxLength: 6990508 |'
      header:
      - key: Accept
        value: application/json
      - key: X-API-Key
        value: '{{apiKey}}'
        description: Set apiKey locally; never share the real value.
      - key: X-Timestamp
        value: '{{apiTimestamp}}'
        description: Generated locally by the collection HMAC pre-request script for each request.
      - key: X-Nonce
        value: '{{apiNonce}}'
        description: Generated locally by the collection HMAC pre-request script for each request.
      - key: X-Signature
        value: '{{apiSignature}}'
        description: Generated locally by the collection HMAC pre-request script for each request.
      - key: Content-Type
        value: application/json
      url:
        raw: '{{baseUrl}}/uploadExpenseFile'
        host:
        - '{{baseUrl}}'
        path:
        - uploadExpenseFile
      body:
        mode: raw
        raw: "{\n  \"apid\": 123,\n  \"id\": 1,\n  \"content_base64\": \"JVBERi0xLjQKJSBFeGFtcGxlIG9ubHkK\"\n}"
        options:
          raw:
            language: json
    response: []
