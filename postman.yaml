- name: Reservations
  description: Reservations and their associated extras.
  item:
  - name: getReservations
    request:
      method: GET
      description: 'List reservations by identity or the existing date and equality filters.


        Require rcode, or channelmanager and id together, or at least one date filter.


        Do not combine rcode and CM identity; reject incomplete CM selectors even when dates are supplied.


        Identity and list filters cannot be combined: rcode/CM selectors reject from_date, to_date, reservation_date, date_filter,
        room, provider, language and nif rather than ignoring them.


        date_filter requires from_date or to_date; from_date <= to_date. Validate real calendar dates.


        The current date search rejects dates more than 365 days in the past; future dates are accepted.


        Preserve supplied filters. This is not an overlap search. Without date_filter the end boundary is midnight; with it,
        the selected end day is included.


        Parameters


        | Field | Type | Required | Description / constraints |

        | --- | --- | --- | --- |

        | `apid` | integer | Yes | Property ID belonging to the authenticated account.  |

        | `rcode` | string | No | Exact reservation code. pattern: "^[A-Za-z0-9._-]{1,80}$" |

        | `channelmanager` | string | No | Channel manager name for the external id. pattern: "^[A-Za-z0-9_]+$" |

        | `id` | integer | No | Numeric resource/document identity. minimum: 1; maximum: 9007199254740991 |

        | `from_date` | string | No | Without date_filter: check-in >= this date at midnight. pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        |

        | `to_date` | string | No | Without date_filter: checkout <= this date at midnight. With date_filter: include the
        selected end day. pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" |

        | `reservation_date` | string | No | Lower bound on reservation creation, not a single-day match. pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        |

        | `date_filter` | string | No | Apply both boundaries to check-in or checkout. enum: ["checkin","checkout"] |

        | `get_archived` | boolean | No | Search archived instead of active reservations. CM identity lookup searches both
        in the current app.  |

        | `room` | string | No | Room filter.  |

        | `provider` | string | No | Exact provider filter.  |

        | `language` | string | No | Exact language filter.  |

        | `nif` | string | No | Exact reservation VAT ID, not invoicing_nif.  |'
      header:
      - key: Accept
        value: application/json
      - key: X-API-Key
        value: '{{apiKey}}'
        description: Set apiKey locally; never share the real value.
      - key: X-Timestamp
        value: '{{apiTimestamp}}'
        description: Generated locally by the collection HMAC pre-request script for each request.
      - key: X-Nonce
        value: '{{apiNonce}}'
        description: Generated locally by the collection HMAC pre-request script for each request.
      - key: X-Signature
        value: '{{apiSignature}}'
        description: Generated locally by the collection HMAC pre-request script for each request.
      url:
        raw: '{{baseUrl}}/getReservations?apid=123&rcode=ABC123'
        host:
        - '{{baseUrl}}'
        path:
        - getReservations
        query:
        - key: apid
          value: '123'
        - key: rcode
          value: ABC123
    response: []
  - name: addReservation
    request:
      method: POST
      description: 'Create a reservation using current app fields.


        Require name or first_name and last_name. Validate calendar/time values and checkout after check-in.


        Parameters


        | Field | Type | Required | Description / constraints |

        | --- | --- | --- | --- |

        | `apid` | integer | Yes | Property ID belonging to the authenticated account.  |

        | `rcode` | string | Yes | Exact reservation code. pattern: "^[A-Za-z0-9._-]{1,80}$" |

        | `name` | string | No | Full name; alternative to first_name and last_name. minLength: 1 |

        | `first_name` | string | No | First name. minLength: 1; maxLength: 40 |

        | `last_name` | string | No | Last name. minLength: 1; maxLength: 40 |

        | `check_in` | string | Yes | Check-in in the existing app/server business timezone; no per-property conversion is
        added. pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}$" |

        | `check_out` | string | Yes | Checkout in the existing app/server business timezone; no per-property conversion is
        added. pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}$" |

        | `pax` | integer | No | Number of guests; default 1. minimum: 0; maximum: 100 |

        | `email` | string | No | Guest email.  |

        | `phone` | string | No | Guest phone.  |

        | `received_amount` | string | No | Received amount; default 0. pattern: "^-?[0-9]+(\\.[0-9]+)?$" |

        | `host_commission` | string | No | Channel commission; default 0. pattern: "^-?[0-9]+(\\.[0-9]+)?$" |

        | `cleaning_fee` | string | No | Cleaning fee; default 0. pattern: "^-?[0-9]+(\\.[0-9]+)?$" |

        | `extra_fees` | string | No | Extra fees; default 0. pattern: "^-?[0-9]+(\\.[0-9]+)?$" |

        | `city_tax` | string | No | City tax; default 0. pattern: "^-?[0-9]+(\\.[0-9]+)?$" |

        | `provider` | string | No | Provider/channel name.  |

        | `room` | string | No | Room, or comma-separated rooms as accepted by the current app.  |

        | `beds` | string | No | Beds.  |

        | `private_note` | string | No | Reservation private note.  |

        | `service_notes` | string | No | Service user notes.  |

        | `vat_number` | string | No | Reservation customer VAT ID.  |

        | `vat_name` | string | No | Reservation customer fiscal name.  |

        | `flight` | string | No | Flight number.  |

        | `flight_time` | string | No | Flight time.  |

        | `arrival_by` | string | No | Arrival transport.  |

        | `service_in` | string | No | Assigned check-in service.  |

        | `service_out` | string | No | Assigned checkout service.  |

        | `service_cleaning` | string | No | Assigned cleaning service.  |

        | `service_transfer_arr` | string | No | Assigned arrival transfer service.  |

        | `service_transfer_dep` | string | No | Assigned departure transfer service.  |

        | `service_laundry` | string | No | Assigned laundry service.  |

        | `reservation_date` | string | No | Reservation creation date; omission uses the current time. pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        |

        | `block_sef` | boolean | No | Block SIBA automation; default false.  |

        | `create_payment` | boolean | No | Create payment; default false.  |'
      header:
      - key: Accept
        value: application/json
      - key: X-API-Key
        value: '{{apiKey}}'
        description: Set apiKey locally; never share the real value.
      - key: X-Timestamp
        value: '{{apiTimestamp}}'
        description: Generated locally by the collection HMAC pre-request script for each request.
      - key: X-Nonce
        value: '{{apiNonce}}'
        description: Generated locally by the collection HMAC pre-request script for each request.
      - key: X-Signature
        value: '{{apiSignature}}'
        description: Generated locally by the collection HMAC pre-request script for each request.
      - key: Content-Type
        value: application/json
      url:
        raw: '{{baseUrl}}/addReservation'
        host:
        - '{{baseUrl}}'
        path:
        - addReservation
      body:
        mode: raw
        raw: "{\n  \"apid\": 123,\n  \"rcode\": \"ABC123\",\n  \"check_in\": \"2026-10-10 16:00\",\n  \"check_out\": \"2026-10-12\
          \ 11:00\",\n  \"name\": \"Example Person\",\n  \"create_payment\": false\n}"
        options:
          raw:
            language: json
    response: []
  - name: updateReservation
    request:
      method: PATCH
      description: 'Update supplied fields in an active or archived reservation.


        Supply at least one editable field in addition to apid and rcode. Omitted fields remain unchanged.


        Creation-only reservation_date, block_sef and create_payment are not accepted.


        When only check_in or check_out is supplied, validate it against the stored counterpart; checkout must follow check-in.


        Parameters


        | Field | Type | Required | Description / constraints |

        | --- | --- | --- | --- |

        | `apid` | integer | Yes | Property ID belonging to the authenticated account.  |

        | `rcode` | string | Yes | Exact reservation code. pattern: "^[A-Za-z0-9._-]{1,80}$" |

        | `name` | string | No | Full name; alternative to first_name and last_name. minLength: 1 |

        | `first_name` | string | No | First name. minLength: 1; maxLength: 40 |

        | `last_name` | string | No | Last name. minLength: 1; maxLength: 40 |

        | `check_in` | string | No | Check-in in the existing app/server business timezone; no per-property conversion is
        added. pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}$" |

        | `check_out` | string | No | Checkout in the existing app/server business timezone; no per-property conversion is
        added. pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}$" |

        | `pax` | integer | No | Number of guests; default 1. minimum: 0; maximum: 100 |

        | `email` | string | No | Guest email.  |

        | `phone` | string | No | Guest phone.  |

        | `received_amount` | string | No | Received amount; default 0. pattern: "^-?[0-9]+(\\.[0-9]+)?$" |

        | `host_commission` | string | No | Channel commission; default 0. pattern: "^-?[0-9]+(\\.[0-9]+)?$" |

        | `cleaning_fee` | string | No | Cleaning fee; default 0. pattern: "^-?[0-9]+(\\.[0-9]+)?$" |

        | `extra_fees` | string | No | Extra fees; default 0. pattern: "^-?[0-9]+(\\.[0-9]+)?$" |

        | `city_tax` | string | No | City tax; default 0. pattern: "^-?[0-9]+(\\.[0-9]+)?$" |

        | `provider` | string | No | Provider/channel name.  |

        | `room` | string | No | Room, or comma-separated rooms as accepted by the current app.  |

        | `beds` | string | No | Beds.  |

