  - name: Current Account
    description: Current-account transactions and period balances.
    item:
    - name: getCurrentAccount
      request:
        method: GET
        description: 'Read current-account transactions for a period, with opening and closing balances.


          Requires the current-account module to be enabled for invoicing_nif. date_start must not exceed date_end.


          C adds amount to the balance; D subtracts it. Opening and closing balances cover the full account period, not only
          the returned page. No property filter changes the balance scope.


          Transactions are ordered by date and stable id. Use limit/offset to retrieve all lines. Concurrent changes between
          requests can alter later pages; each response uses one consistent snapshot.


          Amounts and balances are exact decimal strings. Malformed saved amounts or directions return invalid_stored_amount
          or invalid_stored_type rather than silently changing the balance.


          Parameters


          | Field | Type | Required | Description / constraints |

          | --- | --- | --- | --- |

          | `invoicing_nif` | string | Yes | Explicit invoicing VAT ID; the backend must verify account authorization. pattern:
          "^[A-Za-z0-9._-]{1,20}$" |

          | `date_start` | integer | Yes | Inclusive start of the period in Unix seconds. minimum: 0; maximum: 253402300799
          |

          | `date_end` | integer | Yes | Inclusive end in Unix seconds, including every microsecond of that second. minimum:
          0; maximum: 253402300799 |

          | `limit` | integer | No | Result limit; default 25. minimum: 1; maximum: 100 |

          | `offset` | integer | No | Result offset; default 0. minimum: 0; maximum: 2147483647 |'
