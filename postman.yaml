        description: 'Generate and store the monthly Modelo 30 XML; this does not submit it to AT.


          Requires a configured Finance Service code. Month is an integer 1..12 and is stored/formatted as two digits.


          Include channel commissions for reservations with closed invoices in the selected period, excluding credited documents
          and reservations assigned to another Modelo 30 period. Include saved monthly and recurring manual transactions.


          Regeneration replaces only this period. No eligible data returns 409 no_data without deleting a previous document
          or tracking.


          Serialize generation per account/NIF; publish the XML by atomic rename after the SQL commit. Publication failure
          returns document_publication_pending and requires operator reconciliation.


          The output is the existing ISO-8859-1 XML format. File generation is not declaration submission or legal validation.


