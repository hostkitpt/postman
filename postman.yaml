        - key: contract_ref
          value: ARR-123-2026-001
          disabled: true
          description: Exact contract reference returned by addRentalContract.
    response: []
  - name: addRentalContract
    request:
      method: POST
      description: 'Create a draft rental contract for an ARRE property; automatic invoicing stays disabled.


        Requires the rental-contract module and an ARRE property. parte_comum=true requires nonempty parte_arrendada.


        Tenant arrays are bounded at 20 and the whole UTF-8 body at 8192 bytes. Validate actual calendar dates and countries.


        contract_ref is an opaque unique reference. Do not derive or infer its value from a contract count.


        Parameters


        | Field | Type | Required | Description / constraints |

        | --- | --- | --- | --- |

        | `apid` | integer | Yes | Property ID belonging to the authenticated account.  |

        | `artigo` | string | Yes | Fiscal article. minLength: 1; maxLength: 10 |

        | `fracao` | string | No | Fraction. maxLength: 10 |

        | `contract_type` | string | Yes | Contract type. enum: ["ARREND","SUBARR","PROMES","CEDENC","ALUGUE"] |

        | `purpose` | string | Yes | Purpose. enum: ["H_PERM","H_NPER","N_HABI"] |

        | `start_date` | string | Yes | Start date. pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" |

        | `end_date` | string | No | End date or empty. pattern: "^([0-9]{4}-[0-9]{2}-[0-9]{2})?$" |

        | `rent` | string | Yes | Rent. pattern: "^[0-9]+(\\.[0-9]+)?$" |

        | `deposit` | string | No | Deposit; default 0. pattern: "^[0-9]+(\\.[0-9]+)?$" |

        | `renewable` | boolean | No | Renewable; default false.  |

        | `rent_period` | string | No | Rent period; default MENSAL. enum: ["MENSAL","MENORM"] |

        | `parte_comum` | boolean | No | Common part; default false.  |

        | `parte_arrendada` | string | No | Rented part; required when parte_comum is true. maxLength: 255 |

        | `send_invoice_by_email` | boolean | No | Send invoice by email; default false.  |

        | `tenants` | array of object | Yes |  minItems: 1; maxItems: 20 |

        | `tenants[].name` | string | Yes | Tenant name. minLength: 1; maxLength: 170 |

        | `tenants[].country` | string | Yes | Existing ICAO/ISO country code. minLength: 1 |

        | `tenants[].nif` | string | No | Optional Portuguese VAT ID. pattern: "^([0-9]{9})?$" |

        | `tenants[].id_document` | string | No | Identity document. maxLength: 100 |

        | `tenants[].email` | string | No | Optional tenant email.  |'
      header:
      - key: Accept
        value: application/json
      - key: X-API-Key
        value: '{{apiKey}}'
        description: Set apiKey locally; never share the real value.
      - key: X-Timestamp
        value: '{{apiTimestamp}}'
        description: Generated locally by the collection HMAC pre-request script for each request.
      - key: X-Nonce
        value: '{{apiNonce}}'
        description: Generated locally by the collection HMAC pre-request script for each request.
      - key: X-Signature
        value: '{{apiSignature}}'
        description: Generated locally by the collection HMAC pre-request script for each request.
      - key: Content-Type
        value: application/json
      url:
        raw: '{{baseUrl}}/addRentalContract'
        host:
        - '{{baseUrl}}'
        path:
        - addRentalContract
      body:
        mode: raw
        raw: "{\n  \"apid\": 123,\n  \"artigo\": \"123\",\n  \"contract_type\": \"ARREND\",\n  \"purpose\": \"H_PERM\",\n\
          \  \"start_date\": \"2026-10-01\",\n  \"rent\": \"500.00\",\n  \"tenants\": [\n    {\n      \"name\": \"Example\
          \ Tenant\",\n      \"country\": \"PRT\"\n    }\n  ]\n}"
        options:
          raw:
            language: json
    response: []
  - name: updateRentalContract
    request:
      method: PATCH
      description: 'Update supplied fields and optionally replace tenants of a draft rental contract.


        Only DRAFT contracts belonging to this account and apid can be edited. id, apid, contract_ref, creation date and status
        are immutable.


        Omitted fields remain unchanged; a supplied tenants array replaces all tenants atomically. Validate the effective
        saved and supplied dates and rented-part fields together.


